name: Package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/manage.py check
      # Detect implicit locale-dependent file I/O even on UTF-8 runners.
      - run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests -v
